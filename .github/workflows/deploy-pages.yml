name: Publicar site no GitHub Pages

on:
  push:
    branches: [arena/01a09212-livro-projeto, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Publicar o site (pasta livro continua/site)
        uses: actions/upload-pages-artifact@v3
        with:
          path: "livro continua/site"
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
